name: AI Code Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

  review:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Add Eyes Icon
      - run: echo "👀 Action triggered!"
      - name: Run AI Code Review
        env:
           OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           GITHUB_REPOSITORY: ${{ github.repository }}
           GITHUB_PR_NUMBER: ${{ github.event.issue.pull_request.number || 'No PR' }}
        run: |
           python review.py
      - name: debug
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Payload: ${{ toJson(github.event) }}"

  run-on-comment:
    if: ${{ github.event.name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@go') }}
    needs: setup
    uses: ./.github/workflows/ai-review.yml#review

  first-review:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
    needs: setup
    uses: ./.github/workflows/ai-review.yml#review